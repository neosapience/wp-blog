# Loaded into /etc/apache2/conf-enabled/ (see Dockerfile).
#
# No AllowOverride here on purpose. The premise for adding it — that Debian's
# apache2.conf leaves the docroot at "AllowOverride None" and silently breaks
# pretty permalinks — does not hold for this image: the official wordpress image
# already enables it, verified by dropping an invalid directive into .htaccess
# and getting a 500 from both this image and the 2022 one. Restating it here
# only widens what a writable .htaccess is allowed to override (WordPress can
# rewrite that file from the admin), so the directive is left to the base image.
#
# Silence the "Could not reliably determine the server's fully qualified domain
# name" startup warning. The public hostname is set by the upstream proxy.
ServerName localhost
