# Allow WordPress's .htaccess to take effect (Debian's apache2.conf defaults the
# docroot to "AllowOverride None", which silently disables pretty permalinks,
# the native wp-sitemap.xml, and the llms.txt route). Loaded into
# /etc/apache2/conf-enabled/ (see Dockerfile).
<Directory /var/www/html>
    AllowOverride All
</Directory>

# Silence the "Could not reliably determine the server's fully qualified domain
# name" startup warning. The public hostname is set by the upstream proxy.
ServerName localhost
