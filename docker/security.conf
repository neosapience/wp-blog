# =============================================================================
# Security hardening for the WordPress blog container
# Loaded into /etc/apache2/conf-enabled/ (see Dockerfile)
# Requires mod_headers (enabled in Dockerfile via a2enmod headers).
# =============================================================================

# --- Hide server / platform fingerprint --------------------------------------
# Apache/2.4.53 -> "Apache", and drop the trailing signature on error pages.
ServerTokens Prod
ServerSignature Off

# PHP adds "X-Powered-By: PHP/8.1.6"; strip it at the Apache layer as a
# belt-and-suspenders (expose_php=Off in security.ini is the primary control).
Header always unset X-Powered-By

# WordPress advertises pingback via this header; remove it (xmlrpc is blocked
# below as well).
Header always unset X-Pingback

# --- Security response headers ------------------------------------------------
# HSTS is scoped to the HOST, not the path. This blog is served under
# typecast.ai/kr/learn, so whatever we send here is registered by the browser
# for the whole typecast.ai origin — a header set by the blog would govern the
# entire company domain.
#
# As of 2026-07 neither typecast.ai nor app.typecast.ai sends HSTS at all (only
# maker.typecast.ai does), so adopting it is a domain-wide decision that the
# blog should not make unilaterally. Two deliberate choices follow:
#
#   * no "includeSubDomains" — a single HTTP-only subdomain (internal tooling,
#     staging) would become unreachable for anyone who has visited the blog.
#   * short max-age — HSTS is cached by the browser and cannot be revoked
#     quickly; a mistake at one year is a one-year mistake.
#
# The apex already redirects http -> https at CloudFront, so this adds defence
# in depth without the blast radius. Raise max-age (and only then consider
# includeSubDomains / preload) once the infra owners have confirmed every
# subdomain is HTTPS-only.
Header always set Strict-Transport-Security "max-age=300"

# Clickjacking protection.
Header always set X-Frame-Options "SAMEORIGIN"

# Stop MIME-type sniffing.
Header always set X-Content-Type-Options "nosniff"

# Referrer privacy: send origin only on cross-origin, full URL same-origin.
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Limit powerful browser features by default.
Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()"

# Content-Security-Policy.
# WordPress themes/plugins commonly use inline styles/scripts, so a locked-down
# policy WILL break the admin and many themes. This is a conservative baseline:
#   - upgrades any http asset to https
#   - forbids the site being framed by other origins (clickjacking)
# Tighten script-src/style-src per your theme once you have tested it.
Header always set Content-Security-Policy "upgrade-insecure-requests; frame-ancestors 'self'"

# --- Block xmlrpc.php (pingback SSRF / brute-force amplification) -------------
# If you rely on the Jetpack/mobile app or legitimate pingbacks, remove this.
<FilesMatch "xmlrpc\.php$">
    Require all denied
</FilesMatch>

# --- Block direct access to sensitive files ----------------------------------
<FilesMatch "^(wp-config\.php|readme\.html|license\.txt|\.htaccess|\.git.*)$">
    Require all denied
</FilesMatch>

# <FilesMatch> only ever sees the basename, so the pattern above stops a request
# for "/.git" but not "/.git/config" or "/.git/HEAD". Deny the directory too.
<DirectoryMatch "(^|/)\.git(/|$)">
    Require all denied
</DirectoryMatch>

# --- NOT here: REST author enumeration ---------------------------------------
# Blocking /wp-json/wp/v2/users at this layer was tried and removed. Apache
# cannot tell an authenticated request from a forged one, so any such rule is
# either bypassable or breaks the admin:
#
#   * exempting requests that carry a wordpress_logged_in_* cookie is useless —
#     the cookie is attacker-supplied, and a bare "Cookie: wordpress_logged_in_x=1"
#     walked straight past it and returned the full user list.
#   * denying unconditionally also denies real editors, and the block editor
#     calls /wp/v2/users/me on every load.
#   * the query-string form has encoding variants (?rest_route=%2Fwp%2Fv2%2Fusers)
#     that a path regex keeps missing.
#
# It is also incomplete by construction: /author/<slug>/ answers 200 and leaks
# the same slugs, so closing only the REST route buys nothing.
#
# The fix belongs in WordPress, where capabilities are actually known — a
# rest_endpoints filter requiring list_users, delivered as a mu-plugin. Note the
# image cannot ship it: wp-content lives inside the EBS mount and would mask any
# COPY. It has to be mounted separately (k8s ConfigMap subPath), which is why
# this is tracked as follow-up work rather than solved here.
