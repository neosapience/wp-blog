# 브라우저 캐시 설정. Dockerfile 이 /etc/apache2/conf-enabled/ 로 넣는다.
#
# CloudFront 가 이미 캐시하는데 왜 또 거느냐 — 두 층이 하는 일이 다르다.
# CloudFront 는 오리진 부하를 줄이고, Cache-Control 은 브라우저가 재요청
# 자체를 안 하게 한다. 헤더가 없으면 브라우저는 그 응답을 재사용해도 되는지
# 몰라서 페이지를 옮길 때마다 엣지까지 다시 간다. 엣지가 즉시 돌려주니 서버는
# 편하지만 사용자는 매번 왕복을 낸다.
#
# 2026-08 기준 kr/learn 의 업로드 이미지에 Cache-Control 이 없었다. learn 쪽에는
# 1년이 붙어 있었는데, 그건 예전 SiteGround 호스팅 시절 SG-Optimizer 가
# .htaccess 에 써놓고 플러그인만 지워진 잔재였다. .htaccess 는 EBS 볼륨 안이라
# 저장소에 안 남고, 볼륨을 다시 만들면 조용히 사라진다. 그래서 이미지 쪽으로
# 옮겨 양쪽이 같은 설정을 갖게 한다.
#
# 범위를 업로드 디렉터리로 한정하는 이유 — ExpiresByType 은 콘텐츠 타입만 보므로
# 전역에 걸면 테마와 플러그인이 내보내는 이미지까지 1년이 된다. 그쪽은 파일을
# 같은 이름으로 갈아끼우는 일이 흔해서(플러그인 업데이트, 테마 수정) 옛 파일이
# 최대 1년간 남는다. 업로드는 워드프레스가 이름 충돌 시 접미사를 붙이고
# 서브사이즈에는 -768x384 처럼 크기가 박혀, 내용이 바뀌면 이름도 바뀐다.
#
# CSS·JS 는 넣지 않는다. 워드프레스는 파일명을 그대로 두고 ?ver= 로만 버전을
# 올리는데, 이 배포의 CloudFront 는 일부 경로에서 쿼리스트링을 캐시 키에서
# 무시한다 — uploads/elementor/css 에서 Elementor 가 CSS 를 다시 만들고 ?ver=
# 를 올려도 옛 파일이 내려온 적이 있다(커밋 96b617b8). 브라우저 캐시만 놓고
# 보면 쿼리도 캐시 키의 일부라 ?ver= 로 갱신이 되지만, 그 앞단에서 이미 옛
# 파일이 오면 소용이 없다. 캐시 정책을 경로별로 확인하기 전에는 CSS·JS 에
# 장기 캐시를 걸지 않는다.
<IfModule mod_expires.c>
    <Directory /var/www/html/__SUBDIR__/wp-content/uploads>
        ExpiresActive On

        ExpiresByType image/webp                  "access plus 1 year"
        ExpiresByType image/avif                  "access plus 1 year"
        ExpiresByType image/jpeg                  "access plus 1 year"
        ExpiresByType image/png                   "access plus 1 year"
        ExpiresByType image/gif                   "access plus 1 year"
        ExpiresByType image/svg+xml               "access plus 1 year"

        ExpiresByType video/mp4                   "access plus 1 year"
        ExpiresByType audio/mpeg                  "access plus 1 year"
    </Directory>
</IfModule>
