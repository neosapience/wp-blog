# 폰트 서빙 설정. Dockerfile 이 /opt/fonts 에 넣은 Pretendard 를
# <SUBDIR>/assets/fonts/ 로 노출한다.
#
# wp-content 가 아니라 이미지 안 경로를 쓰는 이유: 프로덕션은 EBS 볼륨이
# /var/www/html/${SUBDIR} 에 마운트되어 있어, 그 아래로 COPY 한 파일은 런타임에
# 볼륨에 가려진다(mu-plugin 에서 겪은 문제). Alias 로 마운트 바깥을 가리키면
# 볼륨과 무관하게 항상 이미지의 파일이 서빙된다.
#
# SUBDIR 은 빌드마다 다르다 — 기본값 blog, 한국 kr/learn, 영문 learn.
#
# SUBDIR 은 빌드 인자라 Dockerfile 이 이 파일을 복사한 뒤 치환한다.

Alias /__SUBDIR__/assets/fonts /opt/fonts

# 경로에 버전 조각이 들어간다: <SUBDIR>/assets/fonts/<버전>/pretendard.css
# 버전은 이미지의 디렉터리 이름이 정본이고, mu-plugin 이 그것을 읽어 URL 을
# 만든다. 여기서 버전을 하드코딩하지 않는 이유가 그것이다.
<Directory /opt/fonts>
    # 이 디렉터리에는 README.md 도 들어 있다. 폰트만 내보낸다.
    Require all denied
    Options -Indexes

    # 파일명이 버전으로 고정돼 있고 내용이 바뀌지 않으므로 길게 캐시한다.
    # 폰트를 갱신할 때는 디렉터리명이나 파일명을 바꿔야 한다.
    <FilesMatch "\.(woff2|css)$">
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # 같은 오리진에서 서빙하므로 CORS 는 필요 없지만, CloudFront 를 거치며
    # 오리진이 달라 보이는 경우를 대비해 woff2 에만 허용해 둔다.
    <FilesMatch "\.woff2$">
        Header set Access-Control-Allow-Origin "*"
    </FilesMatch>
</Directory>
