# 응답 압축 설정. Dockerfile 이 /etc/apache2/conf-enabled/ 로 넣는다.
#
# 베이스 이미지(wordpress:7.0.2-php8.5-apache)는 mod_deflate 를 이미 켜 두지만,
# Debian 이 딸려 보내는 타입 목록(mods-available/deflate.conf)에 application/json 이
# 없다. 목록은 이렇다:
#
#   text/html text/plain text/xml text/css text/javascript
#   application/x-javascript application/javascript application/ecmascript
#   application/rss+xml application/wasm application/xml
#
# 그래서 HTML 은 압축되어 나가는데 REST API(wp-json) 응답만 원본 그대로 나갔다.
# 2026-08 측정으로 kr/learn 의 /wp-json/ 이 393 KB, 같은 응답을 gzip 하면 22 KB 다.
# 인트로가 매 페이지 로드마다 이 응답을 받으므로 그대로 둘 이유가 없다.
#
# 왜 여기냐 — PHP 의 zlib.output_compression 으로도 켤 수 있지만, 그러면 PHP 가
# 만든 응답만 압축되고 정적 .json 은 빠진다. 압축 여부를 콘텐츠 타입 하나로
# 정하는 편이 나중에 "이건 왜 안 눌렸지"를 볼 곳이 한 군데로 남는다.
#
# Content-Type 뒤에 붙는 charset 파라미터는 걱정하지 않아도 된다. Apache 2.4 의
# AddOutputFilterByType 은 파라미터를 떼고 비교한다. 같은 목록에 있는 text/html 이
# "text/html; charset=UTF-8" 로 이미 압축되어 나가는 것이 그 증거다.
#
# mods-enabled 는 conf-enabled 보다 먼저 읽히므로, 이 시점에 mod_filter 와
# mod_deflate 는 이미 올라와 있다. IfModule 은 베이스 이미지가 mod_filter 를
# 빼는 날을 대비한 방어이고, Debian 의 deflate.conf 도 같은 형태를 쓴다.
#
# 아래 목록은 Debian 기본 목록에 없는 것만 담는다. text/html·text/css·
# application/javascript·application/xml 등은 이미 들어 있어 다시 적지 않는다.
#
# 이미 압축된 포맷(woff2·이미지 바이너리·mp4)은 넣지 않는다. 다시 눌러도
# 줄지 않고 CPU 만 쓴다. svg 는 텍스트라 예외다.
<IfModule mod_filter.c>
    AddOutputFilterByType DEFLATE \
        application/json \
        application/ld+json \
        application/manifest+json \
        application/schema+json \
        application/rdf+xml \
        application/atom+xml \
        application/xhtml+xml \
        image/svg+xml \
        image/x-icon \
        image/vnd.microsoft.icon \
        text/cache-manifest \
        text/vtt \
        text/x-component
</IfModule>
