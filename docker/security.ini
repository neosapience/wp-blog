; PHP hardening — loaded into /usr/local/etc/php/conf.d/ (see Dockerfile)
; Removes the "X-Powered-By: PHP/x.y.z" response header (handoff A2).
expose_php = Off

; PHP2Shell(CVE-2026-109618, CVE-2026-109619) 완화책. 베이스 이미지를 패치된
; PHP 8.5.12 로 올렸지만 같은 계열 결함의 공격 경로를 하나 더 막아 둔다.
; WordPress 코어는 업로드 진행률 기능을 쓰지 않는다.
session.upload_progress.enabled = Off
