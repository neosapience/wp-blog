# 로컬 개발용이다. 프로덕션은 EKS 이며 배포 태그는 eks-recipe 의
# k8s/apps/wp-blog/overlays/korea/kustomization.yaml (images.newTag) 에서
# 관리한다. 여기 태그를 바꿔도 배포에는 영향이 없다.
#
# 다만 Makefile 의 tag 와는 맞춰 둔다. 어긋나 있으면 make up-korea 가 저장소
# 상태와 다른 이미지를 띄워, 로컬에서 확인한 것과 배포되는 것이 달라진다.
services:
  wordpress:
    image: neosapience/wordpress:7.0.2-php8.5-apache-korea
